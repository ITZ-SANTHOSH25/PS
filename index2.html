<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0708" />
  <title>LinkShield — Phishing Link Scanner</title>
  <meta name="description" content="LinkShield scans any URL before you access it, protecting you from phishing threats in real time." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23DC143C'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E" />
  <style>
/* ============================================================
   LinkShield — Phishing Link Scanner
   Professional red theme
   Primary: deep red / crimson palette on a refined dark surface
   Alerts: red · Safe: green · Neutral: muted greys
   ============================================================ */

:root {
  /* Red scale */
  --red-900: #3d0808;
  --red-800: #5a0d0d;
  --red-700: #7a1414;
  --red-600: #9e1b1b;
  --red-500: #c41e2a;
  --red-400: #e0243a;
  --red-300: #f0374d;
  --red-glow: #ff4d61;

  --alert: #e0243a;
  --safe: #2faa52;
  --safe-deep: #1f7a3d;
  --amber: #d98a1f;

  /* Surfaces */
  --bg: #0a0708;
  --surface: #140d0e;
  --surface-2: #1b1213;
  --surface-3: #241618;
  --elev: #2c1b1d;
  --border: #34201f;
  --border-2: #43262a;
  --border-soft: #2a1819;

  --text: #f4ecec;
  --text-2: #c7b4b4;
  --text-3: #9a8484;
  --text-4: #6e5c5c;

  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,.3);
  --shadow: 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.55);
  --shadow-red: 0 8px 24px rgba(196,30,42,.28);

  --sidebar-w: 240px;
  --font: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;

  --r: 196, 30, 42;       /* red-500 as rgb for alpha use */
  --sg: 47, 170, 82;      /* safe as rgb */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-size: 14.5px;
  line-height: 1.55;
  letter-spacing: .1px;
}

body {
  background:
    radial-gradient(1100px 560px at 78% -8%, rgba(var(--r)/.18), transparent 62%),
    radial-gradient(820px 460px at -6% 108%, rgba(60,8,8,.32), transparent 60%),
    var(--bg);
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--red-700); }

/* ---- Global SVG icon sizing ---- */
svg { display: inline-block; vertical-align: middle; }
.card-title svg, .hero svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.badge svg { width: 12px; height: 12px; flex-shrink: 0; }
.stat .icon svg { width: 18px; height: 18px; }
.feature .fi svg { width: 20px; height: 20px; }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
.topbar .quick-scan svg { width: 14px; height: 14px; }
.topbar .search svg { width: 14px; height: 14px; }
.empty svg { width: 38px; height: 38px; }

/* ============================================================
   Layout
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* ---- Sidebar ---- */
.sidebar {
  background: linear-gradient(180deg, #160e0f, #110a0b);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 4px 8px 20px;
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: 12px;
}
.brand .logo {
  width: 38px; height: 38px;
  background: linear-gradient(140deg, var(--red-500), var(--red-700));
  border-radius: 10px;
  display: grid; place-items: center;
  box-shadow: 0 4px 14px rgba(var(--r)/.4);
  flex-shrink: 0;
}
.brand .logo svg { width: 22px; height: 22px; color: #fff; }
.brand .name { font-size: 17px; font-weight: 800; letter-spacing: .2px; line-height: 1.1; }
.brand .name span { color: var(--red-400); }
.brand .tag { font-size: 10.5px; color: var(--text-4); letter-spacing: .4px; text-transform: uppercase; margin-top: 2px; }

.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
  color: var(--text-4); padding: 14px 12px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  transition: background .14s, color .14s;
  border: 1px solid transparent;
  user-select: none;
}
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .8; }
.nav-item:hover { background: var(--surface-3); color: var(--text); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(var(--r)/.5), rgba(var(--r)/.12));
  color: #fff;
  border-color: rgba(var(--r)/.35);
}
.nav-item.active svg { opacity: 1; color: var(--red-300); }

.sidebar-footer {
  margin-top: auto;
  padding: 13px 14px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.45;
}
.sidebar-footer .pulse {
  display: flex; align-items: center; gap: 8px;
  color: var(--safe); font-weight: 700; font-size: 12px; margin-bottom: 5px;
}
.sidebar-footer .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--safe);
  box-shadow: 0 0 0 0 rgba(var(--sg)/.7);
  animation: pulse 2.2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(var(--sg)/.6); }
  70% { box-shadow: 0 0 0 7px rgba(var(--sg)/0); }
  100% { box-shadow: 0 0 0 0 rgba(var(--sg)/0); }
}

/* ---- Main ---- */
.main { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 26px;
  background: rgba(10,7,8,.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar .menu-btn { display: none; }
.topbar h1 { font-size: 18px; font-weight: 800; flex: 1; letter-spacing: .2px; }
.topbar .search { position: relative; flex-shrink: 0; }
.topbar .search input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px 8px 34px;
  border-radius: 999px;
  width: 260px;
  font-size: 12.5px;
  outline: none;
  transition: border-color .15s, background .15s;
}
.topbar .search input:focus { border-color: var(--red-500); background: var(--surface-3); }
.topbar .search input::placeholder { color: var(--text-4); }
.topbar .search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-4);
}
.topbar .quick-scan {
  display: flex; align-items: center; gap: 7px;
  background: linear-gradient(135deg, var(--red-500), var(--red-700));
  color: #fff; font-weight: 700; font-size: 12.5px;
  padding: 8px 16px; border-radius: 999px;
  transition: transform .12s, box-shadow .12s;
  box-shadow: var(--shadow-red);
}
.topbar .quick-scan:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(var(--r)/.4); }

.content {
  padding: 26px;
  max-width: 1260px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}
.view { animation: fade .28s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ============================================================
   Generic components
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.card + .card { margin-top: 16px; }
.card-title {
  font-size: 13.5px; font-weight: 800; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
  letter-spacing: .2px;
}
.card-title .link-action {
  margin-left: auto; font-size: 12px; color: var(--red-400);
  cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 5px;
}
.card-title .link-action:hover { color: var(--red-300); }
.muted { color: var(--text-3); }
.dim { color: var(--text-2); }

.grid { display: grid; gap: 16px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 18px; border-radius: var(--radius-sm);
  font-weight: 700; font-size: 13px;
  transition: transform .1s, box-shadow .15s, background .15s, border-color .15s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: linear-gradient(135deg, var(--red-500), var(--red-700));
  color: #fff;
  box-shadow: var(--shadow-red);
}
.btn-primary:hover { box-shadow: 0 12px 26px rgba(var(--r)/.42); transform: translateY(-1px); }
.btn-ghost {
  background: var(--surface-3); color: var(--text-2); border: 1px solid var(--border-2);
}
.btn-ghost:hover { color: var(--text); border-color: var(--red-600); background: var(--elev); }
.btn-green {
  background: linear-gradient(135deg, var(--safe), var(--safe-deep));
  color: #fff; box-shadow: 0 8px 22px rgba(var(--sg)/.3);
}
.btn-green:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(var(--sg)/.42); }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 13px; font-size: 12px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
  letter-spacing: .2px;
}
.badge-safe { background: rgba(var(--sg)/.14); color: var(--safe); border: 1px solid rgba(var(--sg)/.32); }
.badge-danger { background: rgba(var(--r)/.14); color: var(--red-300); border: 1px solid rgba(var(--r)/.32); }
.badge-muted { background: var(--surface-3); color: var(--text-3); border: 1px solid var(--border-2); }
.badge-submitted { background: rgba(var(--sg)/.14); color: var(--safe); border: 1px solid rgba(var(--sg)/.32); }

code.inline {
  background: var(--surface-3); padding: 2px 7px; border-radius: 5px;
  color: var(--red-300); font-size: 12.5px; font-family: 'SF Mono', Consolas, monospace;
  border: 1px solid var(--border);
}

/* ============================================================
   Dashboard
   ============================================================ */
.hero {
  background: linear-gradient(135deg, rgba(var(--r)/.42), rgba(30,16,16,.55));
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 24px 26px;
  margin-bottom: 18px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -50px; top: -50px;
  width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--r)/.22), transparent 70%);
}
.hero h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; letter-spacing: .2px; }
.hero p { color: var(--text-2); max-width: 600px; font-size: 13.5px; }
.hero .shield-big { position: absolute; right: 26px; bottom: 16px; opacity: .18; width: 80px; height: 80px; }
.hero .shield-big svg { width: 80px; height: 80px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
  position: relative; overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.stat:hover { border-color: var(--border-2); transform: translateY(-2px); }
.stat .icon {
  width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
  margin-bottom: 11px;
}
.stat .num { font-size: 24px; font-weight: 800; line-height: 1; letter-spacing: .3px; }
.stat .lbl { font-size: 11.5px; color: var(--text-3); margin-top: 5px; font-weight: 600; letter-spacing: .2px; }
.stat.scan .icon { background: rgba(var(--r)/.18); color: var(--red-400); }
.stat.safe .icon { background: rgba(var(--sg)/.16); color: var(--safe); }
.stat.block .icon { background: rgba(var(--r)/.18); color: var(--red-300); }
.stat.report .icon { background: rgba(217,138,31,.16); color: var(--amber); }

.dash-cols { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }

.activity-list { display: flex; flex-direction: column; }
.activity-row {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
  padding: 11px 2px; border-bottom: 1px solid var(--border-soft);
}
.activity-row:last-child { border-bottom: none; }
.activity-row .url { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.activity-row .time { font-size: 11.5px; color: var(--text-4); margin-top: 2px; }

.protection-card { text-align: center; }
.protection-card .ring { width: 108px; height: 108px; margin: 4px auto 14px; position: relative; }
.protection-card .ring svg { transform: rotate(-90deg); }
.protection-card .ring .label {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-weight: 800; font-size: 24px; color: var(--safe);
}
.protection-card .status { color: var(--safe); font-weight: 800; font-size: 15px; }
.protection-card .sub { color: var(--text-3); font-size: 12px; margin-top: 4px; }

/* ============================================================
   Scan screen
   ============================================================ */
.scan-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px; margin-bottom: 16px;
}
.scan-input-wrap { display: flex; gap: 10px; align-items: stretch; }
.scan-input { flex: 1; position: relative; }
.scan-input svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--text-4);
}
.scan-input input {
  width: 100%;
  background: var(--surface-3); border: 1px solid var(--border-2);
  color: var(--text); padding: 12px 16px 12px 42px; border-radius: var(--radius-sm);
  font-size: 14px; outline: none; transition: border-color .15s, background .15s;
}
.scan-input input:focus { border-color: var(--red-500); background: var(--elev); }
.scan-input input::placeholder { color: var(--text-4); }
.scan-input input:disabled { opacity: .85; }

.scan-progress { margin-top: 20px; }
.progress-bar {
  height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden;
  border: 1px solid var(--border);
}
.progress-bar .fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--red-600), var(--red-400));
  border-radius: 999px; transition: width .35s ease;
  box-shadow: 0 0 10px rgba(var(--r)/.5);
}
.progress-meta { display: flex; justify-content: space-between; margin-top: 9px; font-size: 12.5px; }
.progress-meta .pct { font-weight: 800; color: var(--red-400); }

.checks { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
.check-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border-soft);
  transition: border-color .2s, background .2s;
}
.check-row .ic { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; }
.check-row .txt { flex: 1; font-weight: 600; font-size: 13px; }
.check-row .state { font-size: 11.5px; font-weight: 700; color: var(--text-4); }
.check-row.pending .state { color: var(--text-4); }
.check-row.running { border-color: var(--red-600); background: var(--surface-3); }
.check-row.running .state { color: var(--red-400); }
.check-row.done { border-color: rgba(var(--sg)/.3); }
.check-row.done .state { color: var(--safe); }
.check-row.done .ic { color: var(--safe); }
.spinner {
  width: 15px; height: 15px; border: 2px solid var(--border-2);
  border-top-color: var(--red-400); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.try-row { margin-top: 16px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.try-row .lbl { font-size: 12px; color: var(--text-4); margin-right: 2px; }

/* ============================================================
   Result screens
   ============================================================ */
.result-wrap { max-width: 600px; margin: 6px auto 0; }
.result-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 30px 28px; text-align: center;
  box-shadow: var(--shadow-lg);
}
.result-card.danger { border-color: rgba(var(--r)/.45); }
.result-card.safe { border-color: rgba(var(--sg)/.4); }
.result-icon { width: 72px; height: 72px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 50%; }
.result-icon.danger { background: radial-gradient(circle, rgba(var(--r)/.28), rgba(var(--r)/.05)); color: var(--red-400); }
.result-icon.safe { background: radial-gradient(circle, rgba(var(--sg)/.26), rgba(var(--sg)/.05)); color: var(--safe); }
.result-icon svg { width: 40px; height: 40px; }
.result-card h2 { font-size: 23px; font-weight: 800; margin-bottom: 6px; letter-spacing: .2px; }
.result-card .danger-text { color: var(--red-400); }
.result-card .safe-text { color: var(--safe); }
.result-card .sub { color: var(--text-2); margin-bottom: 20px; font-size: 13.5px; }

.result-detail {
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm); padding: 14px 16px; text-align: left;
  margin-bottom: 16px;
}
.detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; gap: 14px; }
.detail-row + .detail-row { border-top: 1px solid var(--border-soft); }
.detail-row .k { color: var(--text-3); flex-shrink: 0; }
.detail-row .v { font-weight: 700; word-break: break-all; text-align: right; }

.info-box {
  text-align: left; border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 16px;
}
.info-box.danger { background: rgba(var(--r)/.07); border: 1px solid rgba(var(--r)/.28); }
.info-box.safe { background: rgba(var(--sg)/.06); border: 1px solid rgba(var(--sg)/.28); }
.info-box h4 { font-size: 13px; margin-bottom: 9px; font-weight: 800; letter-spacing: .2px; }
.info-box.danger h4 { color: var(--red-400); }
.info-box.safe h4 { color: var(--safe); }
.info-box ul { padding-left: 18px; color: var(--text-2); font-size: 12.5px; }
.info-box li { margin-bottom: 5px; line-height: 1.5; }

.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ============================================================
   Tables
   ============================================================ */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
thead th {
  text-align: left; padding: 12px 15px; font-size: 11px; text-transform: uppercase;
  letter-spacing: .6px; color: var(--text-3); font-weight: 700;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
}
tbody td { padding: 12px 15px; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: rgba(var(--r)/.08); }
td.url-cell { color: var(--text-2); word-break: break-all; }
.pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 12.5px; color: var(--text-3); }
.pagination .pages { display: flex; gap: 5px; }
.pagination .pg {
  min-width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
  background: var(--surface-3); border: 1px solid var(--border-2); cursor: pointer; font-weight: 700; font-size: 12px;
}
.pagination .pg.active { background: var(--red-600); border-color: var(--red-500); color: #fff; }
.pagination .pg:hover { border-color: var(--red-500); }

/* ============================================================
   Empty states
   ============================================================ */
.empty { text-align: center; padding: 44px 20px; color: var(--text-3); }
.empty svg { opacity: .35; margin-bottom: 12px; color: var(--text-4); }
.empty h3 { color: var(--text-2); font-weight: 700; margin-bottom: 5px; font-size: 14.5px; }
.empty p { font-size: 13px; }

/* ============================================================
   Safe websites
   ============================================================ */
.safe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 12px; }
.safe-site {
  background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
  padding: 14px; display: flex; align-items: center; gap: 11px;
  transition: border-color .15s, transform .15s;
}
.safe-site:hover { border-color: var(--border-2); transform: translateY(-2px); }

/* ============================================================
   LinkShield scanner engine + data store
   - Heuristic URL analysis (no external calls, fully offline)
   - localStorage persistence for scans, reports, settings
   Wrapped in IIFE to avoid global-identifier collisions.
   ============================================================ */
(function () {
'use strict';

const LS = {
  SCANS: 'ls_scans',
  REPORTS: 'ls_reports',
  STATS: 'ls_stats',
  SETTINGS: 'ls_settings',
};
window.LS_KEYS = LS;

const Store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
};

/* ---- default stats seeded from mockup ---- */
function defaultStats() {
  return { scanned: 128, safe: 100, blocked: 100, reports: 28 };
}

/* ---- known-good domains (whitelist) ---- */
const SAFE_DOMAINS = [
  'google.com','www.google.com','youtube.com','wikipedia.org','github.com',
  'amazon.com','www.amazon.com','microsoft.com','apple.com','mozilla.org',
  'stackoverflow.com','linkedin.com','twitter.com','x.com','reddit.com',
  'nytimes.com','bbc.com','cnn.com','instagram.com','netflix.com',
];

/* ---- heuristic patterns that strongly suggest phishing ---- */
const SUSPICIOUS_KEYWORDS = [
  'free','gift','gift-card','reward','prize','winner','claim','verify-account',
  'login-verify','secure-login','account-update','confirm','banking','wallet',
  'crypto','airdrop','suspended','urgent','limited-time','bonus','giveaway',
  'invoice','password-reset','support-login',
];
const SUSPICIOUS_TLDS = ['.xyz','.top','.click','.country','.stream','.download',
  '.loan','.work','.men','.racing','.review','.vip','.cf','.gq','.ml','.tk','.cc','.su'];
const BRAND_IMPERSIONATION = ['amazon','google','paypal','apple','microsoft','netflix',
  'facebook','instagram','bank','chase','wellsfargo','coinbase','binance','gmail','outlook'];

function parseUrl(raw) {
  let s = (raw || '').trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try { return new URL(s); } catch { return null; }
}

function domainMatchesBrand(domain) {
  const d = domain.toLowerCase();
  for (const b of BRAND_IMPERSIONATION) {
    if (d.includes(b) && !SAFE_DOMAINS.includes(d)) {
      // brand name present but not the legit domain
      if (d !== b + '.com' && d !== 'www.' + b + '.com' && d !== b + '.org') return b;
    }
  }
  return null;
}

/*
  Analyze a URL and return a verdict with reasons.
  verdict: 'safe' | 'phishing'
  threat: 'Low' | 'Medium' | 'High' | 'None'
*/
function analyzeUrl(raw) {
  const u = parseUrl(raw);
  const reasons = [];
  let score = 0;

  if (!u) {
    return { verdict: 'phishing', threat: 'High', reasons: ['URL format is invalid or malformed'],
      domain: raw, displayUrl: raw };
  }

  const host = u.hostname.toLowerCase();
  const displayUrl = u.href;
  const path = u.pathname + u.search;

  // 1. Whitelist (legit well-known domains, exact or proper subdomain)
  if (SAFE_DOMAINS.includes(host)) {
    return { verdict: 'safe', threat: 'None', reasons: ['Domain is on the trusted whitelist'],
      domain: host, displayUrl };
  }

  // 2. IP-based host
  if (/^(\d{1,3}\.){3}\d{1,3}$/.test(host)) {
    reasons.push('Uses a raw IP address instead of a domain name');
    score += 25;
  }

  // 3. Suspicious TLD
  for (const tld of SUSPICIOUS_TLDS) {
    if (host.endsWith(tld)) { reasons.push(`Uses a high-risk TLD ("${tld}")`); score += 18; break; }
  }

  // 4. Many subdomains / hyphens / digits
  const parts = host.split('.');
  if (parts.length > 4) { reasons.push('Excessive subdomain depth'); score += 10; }
  const hyphenCount = (host.match(/-/g) || []).length;
  if (hyphenCount >= 2) { reasons.push('Multiple hyphens in domain (common in phishing)'); score += 12; }
  if (/\d/.test(host) && /[a-z]/.test(host) && hyphenCount >= 1) { reasons.push('Mixed letters, numbers and hyphens'); score += 8; }

  // 5. Brand impersonation
  const brand = domainMatchesBrand(host);
  if (brand) {
    reasons.push(`Impersonates brand "${brand}" but domain is not the official one`);
    score += 30;
  }

  // 6. Suspicious keywords in host or path
  const hay = (host + ' ' + path).toLowerCase();
  const matched = SUSPICIOUS_KEYWORDS.filter(k => hay.includes(k));
  if (matched.length) {
    reasons.push(`Suspicious keywords detected: ${matched.slice(0,3).join(', ')}`);
    score += Math.min(10 * matched.length, 30);
  }

  // 7. No HTTPS
  if (u.protocol === 'http:') { reasons.push('Connection is not encrypted (no HTTPS)'); score += 8; }

  // 8. @ symbol / redirect tricks
  if (u.href.includes('@')) { reasons.push('Contains "@" redirect trick'); score += 12; }
  if (/%[0-9a-f]{2}/i.test(u.href) && u.href.length > 80) { reasons.push('Heavily URL-encoded (possible obfuscation)'); score += 6; }

  // 9. Very long URL
  if (u.href.length > 90) { reasons.push('Unusually long URL'); score += 5; }

  // 10. Punycode / IDN homograph
  if (host.includes('xn--')) { reasons.push('Punycode (internationalized) domain — possible homograph attack'); score += 20; }

  if (reasons.length === 0) reasons.push('No suspicious indicators found');

  let verdict, threat;
  if (score >= 35) { verdict = 'phishing'; threat = score >= 60 ? 'High' : 'Medium'; }
  else if (score >= 15) { verdict = 'phishing'; threat = 'Low'; }
  else { verdict = 'safe'; threat = 'None'; }

  // ensure a phishing verdict always has at least one concrete reason
  if (verdict === 'phishing' && reasons.length === 1 && reasons[0] === 'No suspicious indicators found') {
    reasons[0] = 'Domain is not on the trusted whitelist and shows low reputation signals';
  }

  return { verdict, threat, reasons, domain: host, displayUrl };
}

/* ---- scanning step labels (matching mockup) ---- */
const SCAN_STEPS = [
  'Checking URL reputation',
  'Analyzing website content',
  'Scanning for phishing patterns',
  'Checking domain age',
  'Verifying SSL certificate',
];

/* ---- data accessors ---- */
const Data = {
  stats() { return Store.get(LS.STATS, defaultStats()); },
  saveStats(s) { Store.set(LS.STATS, s); },

  scans() { return Store.get(LS.SCANS, []); },
  addScan(rec) {
    const list = Data.scans();
    list.unshift(rec);
    Store.set(LS.SCANS, list.slice(0, 200));
  },

  reports() { return Store.get(LS.REPORTS, []); },
  addReport(rep) {
    const list = Data.reports();
    list.unshift(rep);
    Store.set(LS.REPORTS, list.slice(0, 200));
  },

  settings() {
    return Store.get(LS.SETTINGS, {
      autoScan: true,       // auto-launch scan when a URL is provided
      blockPhishing: true,
      autoReport: true,
      notifySafe: false,
      deepScan: true,
    });
  },
  saveSettings(s) { Store.set(LS.SETTINGS, s); },
};

function fmtDate(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }).replace(',', '') ;
}
function genReportId() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  const stamp = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  return `RPT-${stamp}`;
}

// expose
window.LS_ENGINE = { analyzeUrl, parseUrl, SCAN_STEPS, Data, fmtDate, genReportId, SAFE_DOMAINS, Store, LS };

})();


/* ===== app.js ===== */
/* ============================================================
   LinkShield — app controller (routing + state + renderers)
   ============================================================ */

const { analyzeUrl, parseUrl, SCAN_STEPS, Data, fmtDate, genReportId, Store, LS } = window.LS_ENGINE;
const I = window.I;

const App = {
  route: 'dashboard',
  params: {},
  state: { scanning: false, lastResult: null },

  routes: {
    dashboard:  { title: 'Dashboard',  icon: 'dashboard' },
    scan:       { title: 'Scan Link',  icon: 'scan' },
    history:    { title: 'History',    icon: 'history' },
    reports:    { title: 'Reports',    icon: 'reports' },
    safesites:  { title: 'Safe Websites', icon: 'safe' },
    settings:   { title: 'Settings',   icon: 'settings' },
    about:      { title: 'About',      icon: 'about' },
  },

  init() {
    this.bind();
    this.handleHash();
    window.addEventListener('hashchange', () => this.handleHash());
    // KEY FEATURE: auto-launch scan if a URL was provided (?url= or #scan?url=)
    this.checkAutoScan();
  },

  bind() {
    document.addEventListener('click', (e) => {
      const nav = e.target.closest('[data-nav]');
      if (nav) { e.preventDefault(); this.go(nav.dataset.nav); return; }
      const act = e.target.closest('[data-act]');
      if (act) {
        const fn = App.actions[act.dataset.act];
        if (fn) fn.call(App, act, e);

  },

  go(name) {
    if (name === 'scan') location.hash = '#/scan';

  handleHash() {

      <div class="backdrop" data-act="closeSidebar"></div>
      <div class="app">
        <aside class="sidebar" id="sidebar">
          <div class="brand">
            <div class="logo">${I.shieldCheck}</div>
            <div>
              <div class="name">Link<span>Shield</span></div>
              <div class="tag">Phishing Protection</div>

            Real-time scanning is active. All links are evaluated before access is granted.
          </div>
        </aside>
        <div class="main">
          <header class="topbar">
            <button class="menu-btn" data-act="toggleSidebar">${I.menu}</button>
            <h1 id="page-title">${this.routes[this.route].title}</h1>
            <div class="search">
              ${I.search}
              <input type="text" id="omni-scan" placeholder="Enter a URL to scan" />
            </div>
            <button class="quick-scan" data-act="quickScan">${I.scan} Quick Scan</button>
          </header>
          <main class="content">
            <div id="view" class="view"></div>
          </main>
        </div>
      </div>
      <div class="toast-wrap" id="toasts"></div>
    `;
  },

  renderView() {
    const view = document.getElementById('view');
    const fn = this.views[this.route];
    view.innerHTML = fn ? fn.call(this) : this.views.dashboard.call(this);
    // wire omni-scan input (enter to scan)
    const omni = document.getElementById('omni-scan');
    if (omni) omni.addEventListener('keydown', e => {
      if (e.key === 'Enter' && omni.value.trim()) this.startScan(omni.value.trim());
    });
    // route-specific wiring
    if (this.route === 'scan') this.wireScan();
  },

  highlightNav() {
    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.nav === this.route);
    });
    document.getElementById('page-title').textContent = this.routes[this.route].title;
  },

  /* ---------------- SCAN FLOW ---------------- */
  wireScan() {
    const input = document.getElementById('scan-input');
    const btn = document.getElementById('scan-btn');
    if (input) input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && input.value.trim()) this.startScan(input.value.trim());
    });
    if (btn) btn.addEventListener('click', () => {
      if (input && input.value.trim()) this.startScan(input.value.trim());
      else this.toast('Please enter a URL to scan', 'warn');
    });
  },

  async startScan(rawUrl) {
    if (this.state.scanning) return;
    this.state.scanning = true;
    this.route = 'scan';
    // ensure the scan view is mounted with the scanning layout
    const view = document.getElementById('view');
    view.innerHTML = this.views.scan.call(this, null, { scanning: true, url: rawUrl });
    document.getElementById('page-title').textContent = 'Scanning Link';

    const pctEl = document.getElementById('progress-fill');
    const pctTxt = document.getElementById('progress-pct');
    const statusTxt = document.getElementById('scan-status');
    const checks = Array.from(document.querySelectorAll('.check-row'));

    const totalSteps = SCAN_STEPS.length;
    for (let i = 0; i < totalSteps; i++) {
      checks[i].classList.remove('pending');
      checks[i].classList.add('running');
      checks[i].querySelector('.state').textContent = 'Checking…';
      statusTxt.textContent = SCAN_STEPS[i] + '…';
      await this.sleep(480 + Math.random()*420);
      checks[i].classList.remove('running');
      checks[i].classList.add('done');
      checks[i].querySelector('.ic').innerHTML = I.check;
      checks[i].querySelector('.state').textContent = 'Done';
      const pct = Math.round(((i+1)/totalSteps)*100);
      pctEl.style.width = pct + '%';
      pctTxt.textContent = pct + '%';
    }
    statusTxt.textContent = 'Finalizing analysis…';
    await this.sleep(450);

    const result = analyzeUrl(rawUrl);
    const rec = {
      id: 'SCN-' + Date.now(),
      url: result.displayUrl,
      domain: result.domain,
      verdict: result.verdict,
      threat: result.threat,
      reasons: result.reasons,
      at: new Date().toISOString(),
    };
    Data.addScan(rec);
    // update stats
    const st = Data.stats();
    st.scanned += 1;
    if (result.verdict === 'safe') st.safe += 1; else st.blocked += 1;
    Data.saveStats(st);

    // auto-report phishing if enabled
    if (result.verdict === 'phishing' && Data.settings().autoReport) {
      const rep = { id: genReportId(), url: result.displayUrl, threat: result.threat, status: 'Submitted', at: new Date().toISOString() };
      Data.addReport(rep);
      st.reports += 1; Data.saveStats(st);
      rec.reportId = rep.id;
    }

    this.state.scanning = false;
    this.state.lastResult = { ...rec };
    this.showResult(rec);
  },

  showResult(rec) {
    this.route = rec.verdict === 'safe' ? 'result-safe' : 'result-danger';
    // these aren't in nav; render directly
    const view = document.getElementById('view');
    view.innerHTML = this.views.result.call(this, rec);
    document.getElementById('page-title').textContent = rec.verdict === 'safe' ? 'Scan Result — Safe' : 'Scan Result — Phishing Detected';
    // wire buttons via data-act
  },

  sleep(ms) { return new Promise(r => setTimeout(r, ms)); },

  /* ---------------- TOASTS ---------------- */
  toast(msg, type='ok') {
    const wrap = document.getElementById('toasts');
    if (!wrap) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (type==='warn'?'warn':'ok');
    el.innerHTML = `${type==='warn'?I.alert:I.checkCircle}<span>${msg}</span>`;
    wrap.appendChild(el);
    setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),250); }, 3200);
  },

  /* ---------------- SIDEBAR (mobile) ---------------- */
  toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.querySelector('.backdrop').classList.toggle('show');
  },
  closeSidebar() {
    const sb = document.getElementById('sidebar');
    const bd = document.querySelector('.backdrop');
    if (sb) sb.classList.remove('open');
    if (bd) bd.classList.remove('show');
  },

  /* ---------------- ACTIONS (data-act) ---------------- */
  actions: {
    quickScan() { App.go('scan'); setTimeout(()=>{ const i=document.getElementById('scan-input'); if(i) i.focus(); },80); },
    toggleSidebar() { App.toggleSidebar(); },
    closeSidebar() { App.closeSidebar(); },
    goBack() { history.length>1 ? history.back() : App.go('dashboard'); },
    openWebsite(el) {
      const url = el.dataset.url;
      window.open(url, '_blank', 'noopener');
      App.toast('Opening verified website');
    },
    viewReport() {
      App.go('reports');
      App.toast('Opening report history', 'ok');
    },
    submitReport(el) {
      const url = el.dataset.url;
      const rep = { id: genReportId(), url, threat: el.dataset.threat||'High', status:'Submitted', at:new Date().toISOString() };
      Data.addReport(rep);
      const st = Data.stats(); st.reports += 1; Data.saveStats(st);
      App.showReportSubmitted(rep);
    },
    backToDashboard() { App.go('dashboard'); },
    viewReportHistory() { App.go('reports'); },
    scanAnother() { App.go('scan'); setTimeout(()=>{ const i=document.getElementById('scan-input'); if(i){i.value='';i.focus();} },80); },
    toggle(el) {
      const key = el.dataset.key;
      const s = Data.settings();
      s[key] = !s[key];
      Data.saveSettings(s);
      el.classList.toggle('on', s[key]);
      App.toast(`${key} ${s[key]?'enabled':'disabled'}`.replace(/([a-z])([A-Z])/g,'$1 $2'));
    },
    clearHistory(el) {
      const type = el.dataset.type;
      if (type==='scans') Store.set(LS.SCANS, []);
      if (type==='reports') Store.set(LS.REPORTS, []);
      App.toast('History cleared');
      App.render();

    this.route = 'report-submitted';

      const protectPct = st.scanned ? Math.round((st.safe / st.scanned) * 100) : 100;
      const circ = 2*Math.PI*52;

      const act = scans.length ? scans.map(s => `

      const danger = rec.verdict === 'phishing';

      const detail = `

          <div class="detail-row"><span class="k">Status</span><span class="v" style="color:${danger?'var(--red-400)':'var(--safe)'}">${danger?'Blocked':'Verified Safe'}</span></div>

      const reasons = rec.reasons && rec.reasons.length ? `
        <div class="info-box ${danger?'danger':'safe'}">
          <h4 style="${danger?'':'color:var(--safe)'}">${danger?'Threat indicators detected':'Scan summary'}</h4>

        </div>` : '';

      const dangerBox = danger ? `
        <div class="info-box danger">
          <h4>Next steps</h4>

      const actions = danger
        ? `<div class="result-actions">

              ? `<button class="btn btn-primary" data-act="viewReport">${I.reports} View Report</button>`

    history() {

      return `

      const cards = feats.map(([ic,t,d]) => `

          <div class="fi">${ic}</div>

      return `
        <div class="hero" style="margin-bottom:18px">

          <div class="card-title">${I.shieldCheck} About this build</div>
          <p class="dim" style="font-size:14px">LinkShield v1.0 — a self-contained phishing link scanner. Analysis runs entirely in your browser using a heuristic engine that checks URL reputation, website content signals, phishing patterns, domain age indicators and SSL status. No external network calls are made, keeping your browsing private.</p>
        </div>`;
    },
  },
};

/* ---- helpers ---- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function emptyState(t,d){ return `<div class="empty">${I.empty}<h3>${t}</h3><p>${d}</p></div>`; }

// add tryUrl action + result routes to nav-less set
App.actions.tryUrl = function(el){ App.startScan(el.dataset.url); };

/* expose App + init handled by robust bootstrap below */
window.App = App;


/* ===== Robust bootstrap: run app as soon as the DOM is ready, with fallbacks ===== */
(function bootstrap() {
  "use strict";

    try {
      const A = (typeof App !== 'undefined') ? App : window.App;
      if (A && typeof A.init === 'function') {
        A.init();
      } else {
        console.error("[LinkShield] App object not found at init time");
      }
    } catch (err) {
      console.error("[LinkShield] Init failed:", err);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    // DOM already parsed (or 'interactive'/'complete') -> start immediately
